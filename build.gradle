plugins {
    
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "csp-modern" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Standalone developer tooling (AECS-II AST parser). Not part of the mod jar.
sourceSets {
    aecs {
        java.srcDir 'src/aecs/java'
    }
}

// The self-tests live in the `test` source set but are run by a standalone
// javac/java harness, not `gradle test`. Give the test source set the main
// classpath so tests that touch Minecraft types (e.g. MachineValidatorSelfTest,
// which names net.minecraft.block.Block through MachineSpec) compile; the
// harness still compiles only the Minecraft-free subset it can run headless.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but nearly all mods need it.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Add the MixinExtras library, which is often useful.
    modImplementation "io.github.llamalad7:mixinextras-fabric:0.3.5" // Includes the library in the mod jar

    // AECS-II standalone AST parser tool (not shipped in the mod).
    aecsImplementation "com.github.javaparser:javaparser-core:${project.javaparser_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Match your target release version
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "_${project.archivesBaseName}"}
    }
}

// Provenance gate (mission rule 2: nothing is guessed). Fails the build if any
// physics constant is an unresolved placeholder; prints a notice for every
// reference value still flagged to_verify. See src/main/resources/provenance.json.
tasks.register('checkProvenance') {
    description = 'Fails if a physics constant is a guessed (unresolved placeholder) value.'
    group = 'verification'
    def registry = file('src/main/resources/provenance.json')
    doLast {
        if (!registry.exists()) {
            throw new GradleException("provenance.json is missing — the constants are untracked")
        }
        def json = new groovy.json.JsonSlurper().parseText(registry.text)
        def unresolved = []
        def toVerify = []
        json.entries.each { key, e ->
            def status = (e.status ?: 'placeholder').toString().toLowerCase()
            if (status == 'placeholder' && !(e.fallback as boolean)) {
                unresolved << key
            } else if (status == 'to_verify') {
                toVerify << key
            }
        }
        if (!unresolved.isEmpty()) {
            throw new GradleException("Unresolved placeholder constants (no source, no fallback): "
                + unresolved.join(', ') + "\nCite a source or mark it to_verify.")
        }
        if (!toVerify.isEmpty()) {
            logger.lifecycle("Provenance: " + toVerify.size()
                + " reference constants still TO VERIFY against a NIKIET/design source:")
            toVerify.each { logger.lifecycle("  - " + it) }
        }
    }
}

tasks.named('check') { dependsOn 'checkProvenance' }

// Phenomena gate (option A): the completeness authority for the reactor PHYSICS.
// A phenomenon that is COMPUTED but NOT COUPLED is a bug by definition — the
// quantity moves on a display while k_eff does not, which is exactly the xenon
// failure this register was built to catch. So READOUT fails the build.
//
// NAMED_ONLY does NOT fail the build: there are 10 of them and they are a real
// backlog, so failing on them would only get this gate switched off. They are
// printed as a blocking notice on every build instead, with a count that cannot
// be quietly ignored, and --strict (or -PstrictPhenomena) makes them fatal too.
tasks.register('checkPhenomena') {
    description = 'Fails if a phenomenon is computed but not coupled (READOUT).'
    group = 'verification'
    def register = file('src/main/resources/phenomena-register.json')
    def strict = project.hasProperty('strictPhenomena')
    doLast {
        if (!register.exists()) {
            throw new GradleException("phenomena-register.json is missing — the physics is untracked")
        }
        def json = new groovy.json.JsonSlurper().parseText(register.text)
        def items = json.items
        def byStatus = items.groupBy {
            (it.status ?: 'unsourced').toString().toLowerCase().replace('-', '_')
        }
        def readout = byStatus['readout'] ?: []
        def blocked = byStatus['blocked_on_data'] ?: []
        def named = byStatus['named_only'] ?: []
        def unsourced = byStatus['unsourced'] ?: []
        def modelled = byStatus['modelled'] ?: []

        logger.lifecycle("Phenomena: ${items.size()} registered — ${modelled.size()} modelled, "
            + "${readout.size()} readout (NOT coupled), ${blocked.size()} blocked on data, "
            + "${named.size()} named-only, ${unsourced.size()} unsourced")

        if (!readout.isEmpty()) {
            def lines = readout.collect { "  - ${it.id}: ${it.name_en}" }.join('\n')
            throw new GradleException("Phenomena computed but NOT coupled (READOUT). A "
                + "quantity that is displayed but cannot change k_eff is a bug — either "
                + "couple it or drop the readout:\n" + lines)
        }
        if (!unsourced.isEmpty()) {
            def lines = unsourced.collect { "  - ${it.id}: ${it.name_en}" }.join('\n')
            throw new GradleException("Phenomena with NO source (unsourced). Cite a source "
                + "or justify its absence:\n" + lines)
        }
        if (!blocked.isEmpty()) {
            logger.lifecycle("Phenomena: ${blocked.size()} phenomena are BLOCKED ON DATA "
                + "(built, cannot couple without a library/toolchain that is not present):")
            blocked.each { logger.lifecycle("  - ${it.id}: ${it.name_en}") }
        }
        if (!named.isEmpty()) {
            logger.lifecycle("Phenomena: ${named.size()} phenomena are named-only (not built). "
                + "This is the physics backlog — the register says what a real RBMK does and "
                + "the model does not:")
            named.each { logger.lifecycle("  - ${it.id}: ${it.name_en}") }
            if (strict) {
                throw new GradleException("${named.size()} named-only phenomena (strict mode).")
            }
        }
    }
}

tasks.named('check') { dependsOn 'checkPhenomena' }

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
tasks.register('printTestCp') {
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}

