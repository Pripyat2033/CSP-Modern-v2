plugins {
    
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "csp-modern" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Standalone developer tooling (AECS-II AST parser). Not part of the mod jar.
sourceSets {
    aecs {
        java.srcDir 'src/aecs/java'
    }
}

// The self-tests live in the `test` source set but are run by a standalone
// javac/java harness, not `gradle test`. Give the test source set the main
// classpath so tests that touch Minecraft types (e.g. MachineValidatorSelfTest,
// which names net.minecraft.block.Block through MachineSpec) compile; the
// harness still compiles only the Minecraft-free subset it can run headless.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but nearly all mods need it.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Add the MixinExtras library, which is often useful.
    modImplementation "io.github.llamalad7:mixinextras-fabric:0.3.5" // Includes the library in the mod jar

    // AECS-II standalone AST parser tool (not shipped in the mod).
    aecsImplementation "com.github.javaparser:javaparser-core:${project.javaparser_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Match your target release version
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}